<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIMI · 局部改稿对照</title>
<style>body{max-width:960px;margin:40px auto;padding:0 24px;color:#29432e;background:#fafbf6;font:18px/1.7 Calibri,'Microsoft YaHei',sans-serif}fieldset{background:white;border:1px solid #d6dfce;border-radius:18px;padding:24px}button,input{font:inherit;color:inherit;border:1px solid #d6dfce;border-radius:12px;padding:10px 14px;margin:6px}button{cursor:pointer;background:#edf3e7}input{width:min(330px,85%);background:white}#error{color:#a8492b}small{color:#728667}</style>
<h1>FIMI · 局部改稿对照</h1><p>4份固定文字，旧、新编辑各重复2次；逐项检查后再比较独立终审。正常最多32次，加格式修复总计最多36次。不会自动开始请求。</p>
<fieldset><legend>连接个人 DeepSeek API</legend><input id="key" type="password" autocomplete="off" placeholder="密钥仅存于本地进程内存"><button id="connect">连接</button><button id="disconnect">清除连接</button><p id="connection"></p></fieldset>
<p id="status" role="status" aria-live="polite"></p><p id="error" role="alert"></p><button id="next" disabled>运行下一项</button><button id="stop">停止当前项</button><p><small>连接后请回复“已连接”。由助手逐对核对结果。刷新页面不会清除密钥；重启服务会清除。本页不执行测试源码，不验证线上CloudBase部署。</small></p><ol id="results"></ol>
<script nonce="__NONCE__">
const token='__NONCE__',$=id=>document.getElementById(id);let busy=false,localError='';
async function post(route,body={}){const r=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json','X-Evaluation-Token':token},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error);return d;}
async function refresh(){try{const s=await(await fetch('/status')).json();$('connection').textContent=s.connected?'已连接：密钥保存在本地测试服务中':'未连接';$('status').textContent=`${s.stage==='editor'?'编辑对照':'终审对照'} · ${s.running?'正在测试 '+s.phase:'等待或已结束'} · 请求 ${s.dispatched}/${s.limit} · 格式修复 ${s.repairs}/4`;$('error').textContent=localError||s.lastError;$('connect').disabled=busy||s.running;$('disconnect').disabled=busy||s.running;$('next').disabled=busy||s.running||!s.connected||!s.remaining;$('results').replaceChildren(...s.results.map(r=>{const li=document.createElement('li');li.textContent=[r.jobId,r.ok?'已返回（正确性另行判定）':'未返回：'+r.error,`${r.calls}次请求`].join(' · ');return li;}));}catch(e){$('error').textContent=e.message;}}
async function action(fn){if(busy)return;busy=true;localError='';$('connect').textContent='处理中…';try{await fn();}catch(e){localError=e.message;}finally{busy=false;$('connect').textContent='连接';await refresh();}}
$('connect').onclick=()=>action(async()=>{await post('/connect',{key:$('key').value});$('key').value='';});$('disconnect').onclick=()=>action(()=>post('/disconnect'));$('next').onclick=()=>action(()=>post('/next'));$('stop').onclick=()=>action(()=>post('/stop'));refresh();setInterval(refresh,3000);
</script></html>
