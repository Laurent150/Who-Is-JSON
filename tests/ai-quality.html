<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIMI · AI 质量对照</title>
<style>body{font:17px/1.7 Calibri,'Microsoft YaHei',sans-serif;color:#29432e;background:#fafbf6;max-width:1100px;margin:auto;padding:28px}fieldset,article{border:1px solid #d6dfce;border-radius:18px;padding:20px;margin:20px 0;background:#fff}button,input,select{font:inherit;border:1px solid #d6dfce;border-radius:12px;padding:10px 14px;color:inherit;background:#fff}button{cursor:pointer;background:#edf3e7}button:disabled{opacity:.5}label{display:inline-block;margin:8px}input{width:320px}p,pre{white-space:pre-wrap;overflow-wrap:anywhere}pre{font-size:13px}small{color:#728667}.settings{display:flex;flex-wrap:wrap;gap:8px}</style>
<h1>FIMI · AI 质量对照</h1><p>把“思考配置”和“独立复核”的影响分开比较。旧版代码已保存为本地快照。测试代码只作为文字分析，不执行；每批最多6份、会话请求总上限见状态栏，失败停止本批。这里使用个人API模拟试用参数，不代表已部署云端通过验收。</p>
<fieldset><legend>连接个人 DeepSeek API</legend><input id="key" type="password" autocomplete="off" placeholder="密钥只保留在本地测试进程内存"><button id="connect">连接</button><button id="disconnect">清除连接</button><span id="connection"></span></fieldset>
<fieldset><legend>本批设置</legend><div class="settings">
<label>代码<select id="id"></select></label><label>对照<select id="variant"><option value="all">四组对照</option><option value="baseline-trial">旧链路 · 思考关闭</option><option value="baseline-thinking">旧链路 · 思考开启</option><option value="candidate-trial">新链路 · 思考关闭</option><option value="candidate-thinking">新链路 · 思考开启</option></select></label>
<label>功能<select id="task"><option value="talk">讲解稿</option><option value="token">词语点读</option><option value="line">语句点读</option></select></label>
<label>语言<select id="locale"><option value="zh-CN">中文</option><option value="en">English</option><option value="both">两种</option></select></label>
<label>阅读模式<select id="readingMode"><option value="beginner">零基础友好</option><option value="standard">标准</option><option value="both">两种</option></select></label>
<label>受众<select id="audience"><option value="beginner">入门理解</option><option value="peer">同事交流</option><option value="review">代码评审</option><option value="all">三种</option></select></label>
<label>详略<select id="detail"><option value="standard">标准</option><option value="brief">简要</option><option value="detailed">详细</option></select></label><label>范围<select id="coverage"><option value="full">完整</option><option value="highlights">重点</option></select></label></div>
<button id="run" disabled>生成本批</button><button id="stop">停止</button></fieldset><p id="status" role="status" aria-live="polite"></p><div id="results"></div>
<script nonce="__NONCE__">
const token='__NONCE__',$=id=>document.getElementById(id);let initialized=false,count=-1,busy=false,localError='';
async function post(route,body={}){const r=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json','X-Evaluation-Token':token},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(r.status===403?'测试服务已重启，当前页面已过期。请刷新此页，再在本地填写密钥并连接。':d.error);return d;}
function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;}
async function refresh(){try{const s=await(await fetch('/status')).json();$('connection').textContent=s.connected?' 已连接':' 未连接';$('run').disabled=!s.connected||s.running||busy;$('connect').disabled=s.running||busy;$('disconnect').disabled=s.running||busy;$('status').textContent=(s.running?'正在生成':'等待或已结束')+' · 已发出 '+s.dispatched+'/'+s.limit+' 次模型请求'+(s.lastError?' · '+s.lastError:'')+(localError?' · '+localError:'');if(!initialized){s.cases.forEach(c=>{const o=el('option',c.name);o.value=c.id;$('id').append(o);});initialized=true;}if(count!==s.results.length){count=s.results.length;$('results').replaceChildren();s.results.forEach(r=>{const a=el('article');a.append(el('h2',r.id+' · '+r.variant+' · '+r.task),el('small',[r.locale,r.readingMode,r.audience,r.detail,r.coverage].join(' · ')));if(!r.ok)a.append(el('p','未完成：'+r.error));else if(r.task==='talk')r.response.sections.forEach(x=>a.append(el('h3',x.title),el('p',x.text)));else a.append(el('p',r.response.answer));if(r.languageWarning)a.append(el('p','语言检查提示：英文结果含中文，需要人工核对。'));const oracle=el('details');oracle.append(el('summary','人工核对基准（未传给模型）'),el('pre',r.oracle.join('\n')));a.append(oracle);const traces=el('details');traces.append(el('summary','实际参数、各阶段原文与用量'),el('pre',JSON.stringify(r.traces,null,2)));a.append(traces);$('results').append(a);});}}catch(e){$('status').textContent=e.message;}}
async function action(fn){if(busy)return;busy=true;localError='';$('connect').disabled=true;$('connect').textContent='处理中…';try{await fn();}catch(e){localError=e.message;}finally{busy=false;$('connect').textContent='连接';await refresh();}}
$('connect').onclick=()=>action(async()=>{await post('/connect',{key:$('key').value});$('key').value='';});$('disconnect').onclick=()=>action(()=>post('/disconnect'));$('stop').onclick=()=>action(()=>post('/stop'));
$('run').onclick=()=>action(()=>post('/run',Object.fromEntries(['id','variant','task','locale','readingMode','audience','detail','coverage'].map(k=>[k,$(k).value]))));refresh();setInterval(refresh,3000);
</script></html>
