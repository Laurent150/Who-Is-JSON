<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIMI · 三种讲解模式专项测试</title>
<style>body{max-width:1140px;margin:32px auto;padding:0 24px;background:#f8f9f4;color:#263e2c;font:16px/1.8 system-ui}h1{font-size:30px}fieldset,article{border:1px solid #cddac4;border-radius:16px;padding:24px;margin:22px 0;background:white}label{display:block;margin:12px 0}input,select,button{font:inherit;border:1px solid #cad8be;border-radius:10px;padding:10px 14px;background:#fcfdf9;color:#29402e}input{width:min(600px,90%)}input[type=checkbox]{width:auto}button{cursor:pointer;margin:8px;background:#eaf1df}button:disabled{opacity:.5}small,.muted{color:#6e7e65}.settings{display:flex;gap:14px;flex-wrap:wrap}.settings label{margin:4px}.status{padding:14px;background:#eaf1df;border-radius:12px}p{white-space:pre-wrap;overflow-wrap:anywhere}pre{white-space:pre-wrap;font-size:13px}article h3{margin-bottom:6px}#connection{font-weight:600}</style>
<h1>FIMI · 三种讲解模式专项测试</h1><p>使用改进后的「入门理解 / 同事交流 / 代码评审」。每批最多 6 份，会话剩余额度见下方计数。对照直接写稿与先核对函数约定再写稿；实验链路先分析约定，再由独立调用核对源码并成稿。遇到失败会停止本批。</p>
<fieldset><legend>连接 DeepSeek</legend><label>服务地址 <input value="https://api.deepseek.com" readonly></label><label>模型 <input id="model" value="deepseek-flash" readonly></label><label>API 密钥 <input id="key" type="password" autocomplete="off" placeholder="由你输入，密钥仅保留在测试进程内存"></label><button id="connect">连接测试服务</button><button id="disconnect">清除连接</button><span id="connection">尚未连接</span><p class="muted">本页与 FIMI 主页面独立。提示词调整后，下一批自动加载新版本，不需要重新输入密钥。只会发送你选择的测试样本；不会执行源码。</p></fieldset>
<fieldset><legend>本批设置</legend><div id="samples"></div><div class="settings"><label>链路<select id="pipeline"><option value="contracts">函数约定 → 核对约定并成稿</option><option value="direct">直接写稿 → 复核（对照）</option></select></label><label>受众<select id="audience"><option value="all">三种全部</option><option value="beginner">入门理解</option><option value="peer">同事交流</option><option value="review">代码评审</option></select></label><label>语言<select id="locale"><option value="zh-CN">中文</option><option value="en">English</option></select></label><label>表达<select id="readingMode"><option value="beginner">零基础友好</option><option value="standard">标准</option></select></label><label>详略<select id="detail"><option value="standard">标准</option><option value="brief">简要</option><option value="detailed">详细</option></select></label><label>范围<select id="coverage"><option value="full">完整</option><option value="highlights">重点</option></select></label></div><button id="run" disabled>生成本批稿件</button><button id="stop">停止本批</button></fieldset>
<div id="status" class="status">正在读取测试设置</div><div id="results"></div>
<script nonce="__NONCE__">
const token='__NONCE__',$=id=>document.getElementById(id),names={beginner:'入门理解',peer:'同事交流',review:'代码评审'};let seeded=false,lastCount=-1;
async function post(route,body={}){const r=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json','X-Evaluation-Token':token},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||'请求失败');return data;}
function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;}
async function refresh(){try{const s=await(await fetch('/status')).json();$('connection').textContent=s.connected?'已连接 DeepSeek Flash · Pro 对照已结束':'尚未连接';$('run').disabled=!s.connected||s.running;$('connect').disabled=s.running;$('status').textContent=(s.running?'生成中':'当前批次已停止或完成')+' · 本会话已发起 '+s.count+'/'+s.limit+' 份 · '+s.results.length+' 份已返回'+(s.lastError?' · '+s.lastError:'');if(!seeded){s.cases.forEach((c,i)=>{const l=el('label'),input=el('input');input.type='checkbox';input.value=c.id;input.checked=i<2;l.append(input,document.createTextNode(' '+c.label));$('samples').append(l);});seeded=true;}
if(lastCount!==s.results.length){lastCount=s.results.length;$('results').replaceChildren();s.results.forEach((r,i)=>{const a=el('article'),entry=el('details');entry.append(el('summary',(i+1)+'. '+r.id+' · '+names[r.audience]+' · '+r.locale+(r.ok?' · 已返回':' · 未完成')));a.append(el('small','模型 '+(r.response?.evaluationProvider?.requestedModel||r.model)+' · 规则版本 '+r.policyRevision+' · '+r.detail+' · '+r.readingMode));if(!r.ok)a.append(el('p','未完成：'+r.error));else{a.append(el('h3',r.response.title),el('p',r.response.note));r.response.sections.forEach(section=>a.append(el('h3',section.title),el('p',section.text)));if(r.response.questions?.length){a.append(el('h3','补充问答'));r.response.questions.forEach(q=>a.append(el('h4',q.question),el('p',q.answer)));}const usage=r.response.usage;a.append(el('p','本稿 token：'+(usage?.totalTokens??'服务未提供')+' · 模型调用：'+(usage?.calls?.length??'未知')));const d=el('details');d.append(el('summary','查看分阶段用量'),el('pre',JSON.stringify(usage,null,2)));a.append(d);}entry.append(a);$('results').append(entry);});}}catch(e){$('status').textContent=e.message;}}
async function action(fn){try{await fn();await refresh();}catch(e){$('status').textContent=e.message;}}
$('connect').onclick=()=>action(async()=>{await post('/connect',{key:$('key').value});$('key').value='';});
$('disconnect').onclick=()=>action(()=>post('/disconnect'));
$('run').onclick=()=>action(()=>post('/run',{samples:[...document.querySelectorAll('#samples input:checked')].map(i=>i.value),...Object.fromEntries(['pipeline','audience','locale','readingMode','detail','coverage'].map(k=>[k,$(k).value]))}));
$('stop').onclick=()=>action(()=>post('/stop'));
refresh();setInterval(refresh,3000);
</script></html>
