<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Who Is JSON · 中英文真实代码验收</title>
<style>body{font:16px/1.7 system-ui;background:#f5f6f0;color:#283f30;max-width:850px;margin:50px auto;padding:24px}section{background:white;border:1px solid #dbe3d3;border-radius:18px;padding:24px;margin:20px 0}input,button{font:inherit;border:1px solid #c7d1bf;border-radius:10px;padding:10px 14px}input{width:min(90%,530px)}button{background:#2e4934;color:white;margin:10px 10px 0 0;cursor:pointer}button:disabled{opacity:.45;cursor:default}pre{white-space:pre-wrap;overflow-wrap:anywhere}.note{color:#65745c}h1{font-size:28px}label{display:block}</style>
<h1>中英文真实代码验收</h1><p>固定版本的开源样本 × 中英文 × 零基础／标准模式。先定向检查，再运行选定的回归样本。修正版每次解释包含生成与复核，API 调用量相应增加；结果记录不会自动覆盖。</p>
<p class="note">这会消耗你自己的 DeepSeek API 额度。测试经过软件原有 AI 接口，源码只作静态分析，不执行。密钥仅在本机内存中用于本轮请求，不写入文件、日志或报告；关闭测试服务后清除。</p>
<section><h2>连接 DeepSeek</h2><p>服务：https://api.deepseek.com　模型：deepseek-flash</p><form id="connect"><label for="key">API 密钥</label><input id="key" type="password" autocomplete="off" placeholder="请在这里填写，不要发到聊天中" required><br><button type="submit">保存连接（暂不调用）</button></form><p id="connection">未连接</p></section>
<section><h2>测试进度</h2><p id="progress">正在读取状态</p><pre id="active"></pre><p id="error"></p><button id="pilot" disabled>运行重点检查</button><button id="development" disabled>运行开发集</button><button id="holdout" disabled>运行留出验收集</button><button id="stop">当前请求完成后暂停</button><button id="disconnect">断开并清除密钥</button></section>
<script nonce="__NONCE__">
const token='__NONCE__';const $=id=>document.getElementById(id);
async function post(route,data){const r=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json','X-Evaluation-Token':token},body:JSON.stringify(data)});const value=await r.json();if(!r.ok)throw Error(value.error);return value;}
async function refresh(){try{const s=await(await fetch('/status')).json();$('connection').textContent=s.connected?'已配置 '+s.model+'，密钥保留在本机内存中':'未连接';$('progress').textContent='已准备 '+s.caseCount+' 个测试条目（含复测） · 已完成 '+s.completed+'/'+(s.caseCount*4)+' · 成功 '+s.successful+' · 失败 '+s.failed+(s.running?' · 正在运行':'');$('active').textContent=s.active.join('\n');$('error').textContent=s.lastError;for(const id of ['pilot','development','holdout'])$(id).disabled=!s.connected||s.running||!s.caseCount;}catch{$('error').textContent='测试服务未连接';}}
$('connect').onsubmit=async e=>{e.preventDefault();const key=$('key').value;$('key').value='';try{await post('/connect',{key});await refresh();}catch(e){$('error').textContent=e.message;}};
for(const phase of ['pilot','development','holdout'])$(phase).onclick=async()=>{try{await post('/run',{phase});await refresh();}catch(e){$('error').textContent=e.message;}};
$('stop').onclick=()=>post('/stop',{}).then(refresh);$('disconnect').onclick=()=>post('/disconnect',{}).then(refresh).catch(e=>$('error').textContent=e.message);refresh();setInterval(refresh,2000);
</script></html>
